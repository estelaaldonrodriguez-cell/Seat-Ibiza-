<html lang="es">

    <title>Estela Aldón & Miguel — Stradivarius Style</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ff69b4; /* Fondo rosa */
            color: #ffffff;           /* Letras blancas */
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cabecera estilo Stradivarius */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .logo {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
        }

        /* Contenido principal */
        main {
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
            text-align: center;
            flex: 1;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 3rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        h2 {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.8rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 25px;
            opacity: 0.95;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .firma {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .separador {
            width: 60px;
            height: 1px;
            background-color: #ffffff;
            margin: 30px auto;
        }
